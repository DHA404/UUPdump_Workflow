name: Windows11_26H2_amd64_zh-cn
on: workflow_dispatch
jobs:
  build:
    runs-on: windows-latest
    env:
      Build_VERSION: '26300.9539'
      FILE_NAME: Windows11_26H2_amd64_zh-cn
      UUP_DIR: UUPdump_script/26300.9539_amd64_zh-cn_professional_95cc0dd5_convert_virtual
    timeout-minutes: 360
    steps:
    - name: Checkout
      uses: actions/checkout@v5
    - name: Build ISO
      shell: cmd
      run: 'cd "${{ env.UUP_DIR }}"

        powershell -NoProfile -Command "$c=[IO.File]::ReadAllText(''uup_download_windows.cmd'');$c=$c -replace ''goto :DOWNLOAD_UUPS & exit /b 1'',''goto :DOWNLOAD_UUPS'';$c=$c -replace ''(?<!--retry-wait=5 )--allow-overwrite=true --auto-file-renaming=false'',''--timeout=30 --max-tries=5 --retry-wait=5 --allow-overwrite=true --auto-file-renaming=false'';$c=$c -replace ''(?<=edition=app&aria2=2\x22\r?\n)if %%ERRORLEVEL%% GTR 0 call :DOWNLOAD_ERROR & exit /b 1'',''if %%ERRORLEVEL%% GTR 0 goto :DOWNLOAD_APPS'';$c=$c -replace ''if %%ERRORLEVEL%% GTR 0 call :DOWNLOAD_ERROR & exit /b 1'',''if %%ERRORLEVEL%% GTR 0 goto :DOWNLOAD_UUPS'';[IO.File]::WriteAllText(''uup_download_windows.cmd'',$c)"

        uup_download_windows.cmd'
    - name: Package
      run: 7z a -v1950m "${{ env.FILE_NAME }}-${{ env.Build_VERSION }}.7z" "./${{ env.UUP_DIR }}/*.iso" -mx=0
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.FILE_NAME }}-${{ env.Build_VERSION }}
        path: ${{ env.FILE_NAME }}-${{ env.Build_VERSION }}.7z*
